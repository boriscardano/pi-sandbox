name: CI

on:
  push:
    branches:
      - main
  pull_request:

# The workflow only reads the repository. Persist-credentials is off on checkout
# too, so nothing can push with the job's token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run --with pytest pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Since `uvx ruff` is how ruff runs, uv has to be installed for it.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: shellcheck pi entrypoint.sh
      - run: uvx ruff check test_pi.py e2e.py
      - run: uvx ruff format --check test_pi.py e2e.py

  # The real wrapper on the runner's own Docker: it builds the image, starts Pi
  # as the runner user in a pseudo-terminal, checks the mounts from inside the
  # container it started, ends sessions every way one can end and checks that
  # no container is left, then rebuilds for a new Pi and checks the old build
  # cache is pruned. No API key and no model call.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 e2e.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-report
          path: e2e-report.txt
